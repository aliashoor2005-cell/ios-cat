name: Build iOS 8 IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make zip unzip git curl build-essential
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /tmp/ldid || \
          curl -fsSL https://github.com/theos/ldid/releases/latest/download/ldid-linux_x86_64 -o /tmp/ldid || true
          if [ -f /tmp/ldid ]; then
            chmod +x /tmp/ldid
            sudo mv /tmp/ldid /usr/local/bin/ldid
          fi

      - name: Setup Theos and iOS 8 SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git ~/sdks-repo

          cd ~/sdks-repo
          for f in *iPhoneOS8* *iPhoneOS9*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.tbz|*.tar.bz2) tar -xjf "$f" -C ~/theos/sdks/ ;;
              *.tar.xz|*.txz)  tar -xJf "$f" -C ~/theos/sdks/ ;;
              *.tar.gz|*.tgz)  tar -xzf "$f" -C ~/theos/sdks/ ;;
              *.zip)           unzip -q "$f" -d ~/theos/sdks/ ;;
              *)
                if [ -d "$f" ]; then
                  cp -r "$f" ~/theos/sdks/
                fi
                ;;
            esac
          done

          # إذا لم يظهر SDK ضمن sdks، ننسخ أول SDK متاح كاحتياط
          if [ -z "$(ls -A ~/theos/sdks)" ]; then
            FIRST_SDK=$(find ~/sdks-repo -maxdepth 2 -name "*.sdk*" | head -n 1)
            if [ -n "$FIRST_SDK" ]; then
              case "$FIRST_SDK" in
                *.tbz|*.tar.bz2) tar -xjf "$FIRST_SDK" -C ~/theos/sdks/ ;;
                *.tar.xz|*.txz)  tar -xJf "$FIRST_SDK" -C ~/theos/sdks/ ;;
                *.tar.gz|*.tgz)  tar -xzf "$FIRST_SDK" -C ~/theos/sdks/ ;;
                *.zip)           unzip -q "$FIRST_SDK" -d ~/theos/sdks/ ;;
                *)               cp -r "$FIRST_SDK" ~/theos/sdks/ ;;
              esac
            fi
          fi

          # توحيد الاسم إلى iPhoneOS8.1.sdk إذا كان المجلد المستخرج باسم مختلف
          SDK_DIR=$(find ~/theos/sdks -maxdepth 1 -type d -name "*.sdk" | head -n 1)
          if [ -n "$SDK_DIR" ] && [ "$(basename "$SDK_DIR")" != "iPhoneOS8.1.sdk" ]; then
            mv "$SDK_DIR" ~/theos/sdks/iPhoneOS8.1.sdk
          fi

          ls -la ~/theos/sdks

      - name: Build Application
        env:
          THEOS: /home/runner/theos
        run: |
          make package
          mkdir -p Payload
          APP_DIR=$(find .theos -maxdepth 3 -name "CatInvoice.app" | head -n 1)
          echo "Found app at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/CatInvoice.app/CatInvoice || true
          fi
          zip -r CatInvoice_iOS8.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CatInvoice-IPA
          path: CatInvoice_iOS8.ipa