name: Build iOS 8 IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache iOS toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/ios-toolchain
          key: ios-toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-toolchain.sh') }}

      - name: Set up toolchain (ld64 + libtapi + ldid + iOS 9.3 SDK)
        run: scripts/setup-toolchain.sh ~/ios-toolchain

      - name: Build IPA (armv7 + armv7s + arm64, iOS 8+)
        run: ./build.sh ~/ios-toolchain

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CatInvoice-IPA
          path: dist/CatInvoice_iOS8.ipa
          if-no-files-found: error
