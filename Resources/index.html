<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام فواتير - Cat Printer</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
  body { margin: 0; background: #f3f4f6; color: #111827; padding: 12px; }
  .wrap { max-width: 780px; margin: 0 auto; background: #fff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  h2 { margin: 0 0 10px; font-size: 19px; }
  .status-bar { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; padding: 8px 10px; border-radius: 7px; font-size: 13px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  input, button { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 14px; }
  input { flex: 1; min-width: 130px; }
  button { cursor: pointer; background: #2563eb; color: #fff; border: none; font-weight: bold; }
  button.secondary { background: #4b5563; }
  button.danger { background: #dc2626; }
  button.success { background: #059669; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #e5e7eb; padding: 7px; text-align: center; font-size: 13px; }
  th { background: #f9fafb; }
  .summary { margin-top: 12px; background: #f9fafb; padding: 10px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .total-box { font-size: 16px; font-weight: bold; color: #059669; }
  .thermal-preview {
    width: 260px; margin: 14px auto; padding: 10px;
    background: #fff; border: 1px dashed #374151; font-size: 12px; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <h2>فاتورة مبيعات - Cat Printer (iOS 8 BLE)</h2>
  <div class="status-bar" id="statusBar">الحالة: جاهز</div>

  <div class="row">
    <input type="text" id="customerName" placeholder="اسم الزبون / الجهة">
    <input type="text" id="invoiceNo" placeholder="رقم الفاتورة">
  </div>

  <div class="row">
    <input type="text" id="itemName" placeholder="اسم المادة / الصنف">
    <input type="number" id="itemQty" placeholder="الكمية" value="1" min="1">
    <input type="number" id="itemPrice" placeholder="السعر" min="0" step="any">
    <button onclick="addItem()">إضافة مادة</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>المادة</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th>المجموع</th>
        <th>حذف</th>
      </tr>
    </thead>
    <tbody id="itemsBody"></tbody>
  </table>

  <div class="summary">
    <div>
      <label>خصم: <input type="number" id="discount" value="0" min="0" step="any" style="width:90px" oninput="render()"></label>
    </div>
    <div class="total-box">الصافي: <span id="grandTotal">0</span></div>
  </div>

  <div class="row" style="margin-top:12px;">
    <button class="success" onclick="printToCatPrinter()">طباعة عبر Cat Printer</button>
    <button class="secondary" onclick="saveInvoice()">حفظ محلي</button>
    <button class="danger" onclick="clearAll()">تفريغ الفاتورة</button>
  </div>

  <div class="thermal-preview" id="thermalBox"></div>
</div>

<canvas id="printCanvas" width="384" height="400" style="display:none;"></canvas>

<script>
let items = JSON.parse(localStorage.getItem('inv_items') || '[]');
document.getElementById('invoiceNo').value = localStorage.getItem('inv_no') || ('INV-' + Math.floor(1000 + Math.random() * 9000));
document.getElementById('customerName').value = localStorage.getItem('inv_cust') || '';
document.getElementById('discount').value = localStorage.getItem('inv_disc') || '0';

function setStatus(msg) {
  document.getElementById('statusBar').textContent = 'الحالة: ' + msg;
}

function addItem() {
  const name = document.getElementById('itemName').value.trim();
  const qty = parseFloat(document.getElementById('itemQty').value) || 0;
  const price = parseFloat(document.getElementById('itemPrice').value) || 0;
  if (!name || qty <= 0 || price < 0) return alert('أدخل اسم المادة والكمية والسعر بشكل صحيح');
  items.push({ name, qty, price });
  document.getElementById('itemName').value = '';
  document.getElementById('itemPrice').value = '';
  saveLocal();
  render();
}

function removeItem(index) {
  items.splice(index, 1);
  saveLocal();
  render();
}

function saveLocal() {
  localStorage.setItem('inv_items', JSON.stringify(items));
  localStorage.setItem('inv_no', document.getElementById('invoiceNo').value);
  localStorage.setItem('inv_cust', document.getElementById('customerName').value);
  localStorage.getItem('inv_disc') !== null && localStorage.setItem('inv_disc', document.getElementById('discount').value);
}

function saveInvoice() {
  saveLocal();
  setStatus('تم حفظ بيانات الفاتورة محلياً.');
}

function clearAll() {
  if (!confirm('هل تريد تفريغ الفاتورة الحالية؟')) return;
  items = [];
  localStorage.removeItem('inv_items');
  render();
}

function render() {
  saveLocal();
  const tbody = document.getElementById('itemsBody');
  tbody.innerHTML = '';
  let subtotal = 0;

  items.forEach((it, idx) => {
    const lineTotal = it.qty * it.price;
    subtotal += lineTotal;
    tbody.innerHTML += `
      <tr>
        <td>${idx + 1}</td>
        <td>${it.name}</td>
        <td>${it.qty}</td>
        <td>${it.price.toLocaleString()}</td>
        <td>${lineTotal.toLocaleString()}</td>
        <td><button class="danger" onclick="removeItem(${idx})">X</button></td>
      </tr>`;
  });

  const disc = parseFloat(document.getElementById('discount').value) || 0;
  const total = Math.max(0, subtotal - disc);
  document.getElementById('grandTotal').textContent = total.toLocaleString();

  const cust = document.getElementById('customerName').value || 'زبون نقدي';
  const invNo = document.getElementById('invoiceNo').value || '-';
  let rowsHtml = items.map(it =>
    `<div>${it.name} (${it.qty}×${it.price}) = <b>${(it.qty*it.price).toLocaleString()}</b></div>`
  ).join('');

  document.getElementById('thermalBox').innerHTML = `
    <div style="text-align:center;font-weight:bold;">فاتورة مبيعات</div>
    <div>رقم: ${invNo}</div>
    <div>الزبون: ${cust}</div>
    <hr>
    ${rowsHtml || '<div>لا توجد مواد</div>'}
    <hr>
    <div>المجموع: ${subtotal.toLocaleString()}</div>
    <div>الخصم: ${disc.toLocaleString()}</div>
    <div style="font-weight:bold;">الصافي: ${total.toLocaleString()}</div>
  `;
}

// حساب CRC8 لبروتوكول Cat Printer
function crc8(data) {
  let crc = 0;
  for (let i = 0; i < data.length; i++) {
    crc ^= data[i];
    for (let j = 0; j < 8; j++) {
      if (crc & 0x80) {
        crc = ((crc << 1) ^ 0x07) & 0xFF;
      } else {
        crc = (crc << 1) & 0xFF;
      }
    }
  }
  return crc;
}

function makePacket(cmd, payload) {
  const pkt = [0x51, 0x78, cmd, 0x00, payload.length & 0xFF, (payload.length >> 8) & 0xFF];
  for (let i = 0; i < payload.length; i++) pkt.push(payload[i]);
  pkt.push(crc8(payload));
  pkt.push(0xFF);
  return pkt;
}

function renderInvoiceToCanvas() {
  const canvas = document.getElementById('printCanvas');
  const ctx = canvas.getContext('2d');
  const width = 384;
  const height = Math.max(320, 220 + items.length * 42);
  canvas.height = height;

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'right';
  ctx.direction = 'rtl';

  let y = 34;
  ctx.font = 'bold 26px Tahoma, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('فاتورة مبيعات', width / 2, y);

  y += 32;
  ctx.textAlign = 'right';
  ctx.font = '18px Tahoma, Arial, sans-serif';
  const invNo = document.getElementById('invoiceNo').value || '-';
  const cust = document.getElementById('customerName').value || 'زبون نقدي';
  ctx.fillText('رقم الفاتورة: ' + invNo, width - 16, y);
  y += 28;
  ctx.fillText('الزبون: ' + cust, width - 16, y);

  y += 16;
  ctx.beginPath();
  ctx.moveTo(16, y);
  ctx.lineTo(width - 16, y);
  ctx.stroke();

  let subtotal = 0;
  items.forEach((it, idx) => {
    y += 30;
    const lineTotal = it.qty * it.price;
    subtotal += lineTotal;
    ctx.font = 'bold 18px Tahoma, Arial, sans-serif';
    ctx.fillText(`${idx + 1}. ${it.name}`, width - 16, y);
    y += 24;
    ctx.font = '17px Tahoma, Arial, sans-serif';
    ctx.fillText(`${it.qty} × ${it.price} = ${lineTotal}`, width - 28, y);
  });

  y += 18;
  ctx.beginPath();
  ctx.moveTo(16, y);
  ctx.lineTo(width - 16, y);
  ctx.stroke();

  const disc = parseFloat(document.getElementById('discount').value) || 0;
  const total = Math.max(0, subtotal - disc);

  y += 30;
  ctx.font = '18px Tahoma, Arial, sans-serif';
  ctx.fillText('المجموع: ' + subtotal, width - 16, y);
  y += 28;
  ctx.fillText('الخصم: ' + disc, width - 16, y);
  y += 32;
  ctx.font = 'bold 22px Tahoma, Arial, sans-serif';
  ctx.fillText('الصافي: ' + total, width - 16, y);

  return { canvas, ctx, width, height };
}

function bytesToBase64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i] & 0xFF);
  }
  return btoa(binary);
}

function printToCatPrinter() {
  setStatus('جاري تجهيز صورة الفاتورة للطابعة...');
  const { ctx, width, height } = renderInvoiceToCanvas();
  const imgData = ctx.getImageData(0, 0, width, height).data;

  const bytesPerLine = width / 8; // 48 bytes per line for 384px
  const stream = [];

  // تهيئة وطلب طباعة نقطية (Raster Print)
  stream.push(...makePacket(0xA1, [0x00]));
  stream.push(...makePacket(0xBE, [0x01]));
  stream.push(...makePacket(0xA2, [0x14])); // سرعة/كثافة الطباعة

  for (let row = 0; row < height; row++) {
    const lineBytes = new Array(bytesPerLine).fill(0);
    for (let col = 0; col < width; col++) {
      const idx = (row * width + col) * 4;
      const r = imgData[idx];
      const g = imgData[idx + 1];
      const b = imgData[idx + 2];
      const a = imgData[idx + 3];
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) * (a / 255) + 255 * (1 - a / 255);
      if (lum < 140) {
        lineBytes[col >> 3] |= (0x80 >> (col & 7));
      }
    }
    stream.push(...makePacket(0xA6, lineBytes));
  }

  // تغذية ورق إضافية بعد الطباعة
  stream.push(...makePacket(0xA1, [0x28]));
  stream.push(...makePacket(0xA1, [0x28]));

  const b64 = bytesToBase64(stream);
  window.location.href = 'catprint://' + b64;
}

['customerName', 'invoiceNo'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

render();
</script>
</body>
</html>
