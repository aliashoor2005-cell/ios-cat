<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>فاتورتي</title>
<!--NATIVE_STORE-->
<style>
/* iOS 8 UIWebView: no CSS variables, no flex "gap", -webkit- prefixes needed */
* { box-sizing: border-box; -webkit-box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
html, body { margin: 0; padding: 0; }
body { font-family: "Helvetica Neue", Helvetica, "Geeza Pro", Arial, sans-serif; font-size: 15px; -webkit-text-size-adjust: 100%; min-height: 100%; }
button, input, select, textarea { font-family: inherit; font-size: 15px; }
.tap { cursor: pointer; }
.hidden { display: none !important; }
.flex { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.grow { -webkit-flex: 1; flex: 1; min-width: 0; }
.between { -webkit-justify-content: space-between; justify-content: space-between; }

/* ---------- theme: dark (default) ---------- */
body { background: #121212; color: #f2f2f2; }
.card { background: #46434e; }
.field input, .field textarea, .inp { background: transparent; color: #f2f2f2; border: 1.5px solid #8d8a94; }
.field label { background: #46434e; color: #c9c6cf; }
.muted { color: #b3b0b9; }
.sub-card { background: #2b2930; }
.header { background: #121212; }
.drawer { background: #121212; color: #f2f2f2; }
.drawer .item.active { background: #2a2a2a; }
.drawer hr, .sep { border-color: #3a3a3a; }
.prod { background: #141414; }
.prod .ph { background: #2b2930; color: #8d8a94; }
.list-row { border-color: #5a5763; }
.modal-box { background: #2b2930; color: #f2f2f2; }
.modal-box .field label { background: #2b2930; }
.dev { background: #46434e; border-color: #5a5763; }
.dev.likely { border-color: #ff9800; }
.lang-btn { border-color: #8d8a94; color: #f2f2f2; }
.log-box { background: #1e1e1e; color: #e8e8e8; }
.qty-btn { background: #2b2930; color: #ff9800; }

/* ---------- theme: light ---------- */
body.light { background: #f2f2f5; color: #1c1b1f; }
body.light .card { background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
body.light .field input, body.light .field textarea, body.light .inp { color: #1c1b1f; border-color: #b9b6c0; }
body.light .field label { background: #ffffff; color: #5e5b66; }
body.light .muted { color: #6b6873; }
body.light .sub-card { background: #f2f2f5; }
body.light .header { background: #f2f2f5; }
body.light .drawer { background: #ffffff; color: #1c1b1f; }
body.light .drawer .item.active { background: #f0f0f3; }
body.light .drawer hr, body.light .sep { border-color: #e2e1e6; }
body.light .prod { background: #f7f7f9; border: 1px solid #ececf0; }
body.light .prod .ph { background: #ececf0; color: #9b98a3; }
body.light .list-row { border-color: #e2e1e6; }
body.light .modal-box { background: #ffffff; color: #1c1b1f; }
body.light .modal-box .field label { background: #ffffff; }
body.light .dev { background: #f7f7f9; border-color: #e2e1e6; }
body.light .dev.likely { border-color: #ff9800; }
body.light .lang-btn { border-color: #b9b6c0; color: #1c1b1f; }
body.light .lang-btn.on { color: #1c1b1f; }
body.light .log-box { background: #ffffff; color: #1c1b1f; }
body.light .qty-btn { background: #f2f2f5; }

/* ---------- layout ---------- */
.header { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 20; padding: 0 8px; }
.header h1 { margin: 0; font-size: 21px; font-weight: normal; text-align: center; }
.hbtn { width: 44px; height: 44px; line-height: 44px; text-align: center; font-size: 26px; background: none; border: none; color: inherit; padding: 0; }
.page { padding: 64px 14px 28px; max-width: 760px; margin: 0 auto; }
.card { border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 14px; font-size: 17px; font-weight: bold; }
.page-title { font-size: 22px; font-weight: bold; margin: 10px 2px 16px; }

.orange { color: #ff9800; }
.red { color: #ef4444; }
.green { color: #4caf50; }
.btn { display: block; width: 100%; border: none; border-radius: 30px; padding: 15px; background: #ff9800; color: #1c1b1f; font-size: 16px; text-align: center; }
.btn:disabled { opacity: .5; }
.btn.small { display: inline-block; width: auto; padding: 10px 24px; font-size: 15px; }
.btn.ghost { background: transparent; color: #ff9800; border: 1.5px solid #ff9800; }
.mt { margin-top: 12px; }

/* outlined input with floating label */
.field { position: relative; margin-top: 14px; }
.field input { width: 100%; border-radius: 6px; padding: 16px 14px 12px; outline: none; -webkit-appearance: none; }
.field label { position: absolute; top: -9px; right: 12px; padding: 0 6px; font-size: 12px; }
html[dir=ltr] .field label { right: auto; left: 12px; }
.field input:focus, .inp:focus { border-color: #ff9800; }
.inp { border-radius: 6px; padding: 13px 12px; outline: none; -webkit-appearance: none; width: 100%; }
.row2 { margin: 0 -5px; }
.row2 > * { margin-left: 5px; margin-right: 5px; }

/* printer card */
.pcard .pname { font-size: 16px; font-weight: bold; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; margin: 0 0 0 6px; vertical-align: middle; }
html[dir=ltr] .dot { margin: 0 6px 0 0; }
.dot.on { background: #4caf50; }
.dot.wait { background: #ffc107; }
.pstate { font-size: 14px; margin-top: 6px; }

/* search with icon */
.search { position: relative; }
.search .inp { padding-left: 44px; padding-right: 14px; }
html[dir=ltr] .search .inp { padding-left: 14px; padding-right: 44px; }
.search .ic { position: absolute; left: 12px; top: 50%; margin-top: -12px; font-size: 20px; line-height: 24px; }
html[dir=ltr] .search .ic { left: auto; right: 12px; }

/* product grid */
.grid { margin: 14px -4px 0; }
.grid:after { content: ""; display: table; clear: both; }
.prod { float: right; width: 47%; width: -webkit-calc(50% - 8px); width: calc(50% - 8px); margin: 0 4px 8px; border-radius: 14px; overflow: hidden; position: relative; text-align: center; }
html[dir=ltr] .prod { float: left; }
.prod .img { width: 100%; height: 0; padding-bottom: 82%; background-size: cover; background-position: center; background-color: #fff; }
.prod .ph { width: 100%; height: 0; padding-bottom: 82%; position: relative; }
.prod .ph span { position: absolute; top: 50%; left: 0; right: 0; margin-top: -18px; font-size: 32px; line-height: 36px; }
.prod .nm { font-size: 16px; font-weight: bold; padding: 10px 6px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prod .pr { font-size: 16px; font-weight: bold; color: #ff9800; padding: 0 6px 12px; }
.prod .badge { position: absolute; top: 8px; left: 8px; background: #ff9800; color: #1c1b1f; border-radius: 14px; min-width: 28px; height: 28px; line-height: 28px; font-weight: bold; font-size: 14px; padding: 0 6px; }
html[dir=ltr] .prod .badge { left: auto; right: 8px; }
.grid.text .prod .nm { padding-top: 18px; }
.grid.text .prod .pr { padding-bottom: 18px; }
.grid.list { margin: 12px 0 0; }
.grid.list .prod { float: none; width: auto; margin: 0 0 8px; text-align: right; }
html[dir=ltr] .grid.list .prod { text-align: left; }
.grid.list .prod .inner { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 8px; }
.grid.list .prod .thumb { width: 54px; height: 54px; border-radius: 10px; background-size: cover; background-position: center; background-color: #fff; margin: 0 0 0 12px; }
html[dir=ltr] .grid.list .prod .thumb { margin: 0 12px 0 0; }
.grid.list .prod .nm { padding: 0; }
.grid.list .prod .pr { padding: 0; }
.grid.list .prod .badge { position: static; display: inline-block; margin: 0 8px; }
.empty { text-align: center; padding: 18px 8px; font-size: 14px; }

/* quick add row */
.quick { margin-top: 10px; }
.quick .inp, .addrow .inp { margin: 0 4px; }
.plus { font-size: 34px; line-height: 40px; width: 46px; text-align: center; background: none; border: none; color: #4caf50; padding: 0; }
.imgpick { width: 48px; height: 48px; border-radius: 10px; overflow: hidden; position: relative; text-align: center; line-height: 48px; font-size: 24px; background-size: cover; background-position: center; margin: 0 0 0 4px; display: block; }
html[dir=ltr] .imgpick { margin: 0 4px 0 0; }
.imgpick input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }

/* cart */
.cart-row { padding: 10px 0; }
.cart-row .nm { font-weight: bold; }
.cart-row .sm { font-size: 13px; margin-top: 3px; }
.qty-btn { width: 34px; height: 34px; border-radius: 17px; border: none; font-size: 20px; line-height: 34px; padding: 0; font-weight: bold; }
.qty { min-width: 30px; text-align: center; font-weight: bold; }
.total-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid; }
.total-row .amt { font-size: 28px; font-weight: bold; color: #ff9800; }
.invno { width: 130px; }
.invno input { text-align: center; font-size: 18px; font-weight: bold; }

/* drawer */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); z-index: 40; }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; width: 82%; max-width: 360px; z-index: 50; overflow-y: auto; -webkit-overflow-scrolling: touch;
  -webkit-transform: translate3d(105%,0,0); transform: translate3d(105%,0,0); -webkit-transition: -webkit-transform .25s ease; transition: transform .25s ease; padding: 28px 18px 24px; }
html[dir=ltr] .drawer { right: auto; left: 0; -webkit-transform: translate3d(-105%,0,0); transform: translate3d(-105%,0,0); }
.drawer.open, html[dir=ltr] .drawer.open { -webkit-transform: translate3d(0,0,0); transform: translate3d(0,0,0); }
.drawer .brand { font-size: 30px; font-weight: bold; color: #ff9800; margin: 6px 4px 16px; }
.drawer hr { border: none; border-top: 1px solid; margin: 10px 0; }
.drawer .item { padding: 15px 14px; border-radius: 30px; font-size: 17px; }
.drawer .item .ic { display: inline-block; width: 34px; font-size: 21px; text-align: center; margin: 0 0 0 10px; vertical-align: middle; }
html[dir=ltr] .drawer .item .ic { margin: 0 10px 0 0; }
.drawer h3 { margin: 14px 4px 10px; font-size: 16px; }
.lang-btn { display: inline-block; border: 1.5px solid; border-radius: 12px; padding: 9px 18px; margin: 0 0 8px 8px; background: none; font-size: 15px; }
html[dir=ltr] .lang-btn { margin: 0 8px 8px 0; }
.lang-btn.on { background: #ff9800; border-color: #ff9800; color: #1c1b1f; }

/* sliders / toggles / radios */
.slider-label { margin: 16px 0 6px; font-size: 15px; }
input[type=range] { -webkit-appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: #ff9800; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 34px; margin-top: -11px; border-radius: 4px; background: #ff9800; box-shadow: 0 0 0 3px rgba(255,152,0,.3); }
.switch { position: relative; width: 58px; height: 32px; display: inline-block; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; z-index: 2; }
.switch span { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 16px; background: #75727c; -webkit-transition: background .2s; transition: background .2s; }
.switch span:after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 12px; background: #1c1b1f; -webkit-transition: -webkit-transform .2s; transition: transform .2s; }
.switch input:checked + span { background: #ff9800; }
.switch input:checked + span:after { -webkit-transform: translateX(26px); transform: translateX(26px); }
.radio { padding: 18px 8px; font-size: 17px; }
.radio .rc { width: 28px; height: 28px; border-radius: 14px; border: 3px solid #c9c6cf; margin: 0 0 0 16px; position: relative; }
html[dir=ltr] .radio .rc { margin: 0 16px 0 0; }
.radio.on .rc { border-color: #ff9800; }
.radio.on .rc:after { content: ""; position: absolute; top: 4px; left: 4px; width: 14px; height: 14px; border-radius: 7px; background: #ff9800; }

/* items manager */
.list-row { padding: 14px 0; border-bottom: 1px solid; }
.list-row:last-child { border-bottom: none; }
.list-row .thumb { width: 52px; height: 52px; border-radius: 8px; background-size: cover; background-position: center; background-color: #fff; margin: 0 0 0 12px; text-align: center; line-height: 52px; font-size: 22px; }
html[dir=ltr] .list-row .thumb { margin: 0 12px 0 0; }
.list-row .t { font-size: 17px; }
.icon-btn { background: none; border: none; font-size: 24px; width: 44px; height: 44px; padding: 0; }
.logo-prev { width: 84px; height: 84px; background-color: #fff; border-radius: 4px; background-size: contain; background-repeat: no-repeat; background-position: center; color: #888; text-align: center; line-height: 84px; font-size: 30px; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }

/* log */
.log-box { border-radius: 14px; padding: 12px; min-height: 300px; font-size: 14px; line-height: 1.9; }

/* modal */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60; background: rgba(0,0,0,.6); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 40px 14px; }
.modal-box { max-width: 460px; margin: 0 auto; border-radius: 18px; padding: 18px; }
.modal-box h2 { margin: 0 0 12px; font-size: 18px; }
.dev { border: 1.5px solid; border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.dev .n { font-weight: bold; }
.dev .s { font-size: 12px; margin-top: 2px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #1c1b1f; border-top-color: transparent; border-radius: 50%; -webkit-animation: spin .8s linear infinite; animation: spin .8s linear infinite; vertical-align: middle; margin: 0 6px; }
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
.chk { font-size: 14px; margin-top: 12px; display: block; }
.company { -webkit-flex: 1; flex: 1; margin: 0 4px; padding: 14px 4px; border-radius: 14px; border: 2px solid #8d8a94; background: none; color: inherit; font-size: 16px; font-weight: bold; }
.company.on { border-color: #ff9800; background: #ff9800; color: #1c1b1f; }
#companyRow { margin: 0 -4px 4px; }
.chk input { -webkit-appearance: checkbox; vertical-align: middle; margin: 0 4px; }

/* toast */
.toast { position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 80; text-align: center; }
.toast span { display: inline-block; background: rgba(30,30,30,.95); color: #fff; border-radius: 22px; padding: 11px 18px; font-size: 14px; max-width: 100%; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
canvas#printCanvas { display: none; }

/* ---------- fast taps ---------- */
.tap, .prod { -webkit-user-select: none; -webkit-touch-callout: none; }
.pressed { opacity: .55; }
select.inp { height: 48px; padding: 0 12px; }
.clear-btn { background: none; border: none; font-size: 16px; font-weight: bold; padding: 8px 4px; }
.print-btn { background: #22c55e; color: #fff; font-weight: bold; }
.foot-row .tot { text-align: left; }
html[dir=ltr] .foot-row .tot { text-align: right; }
.foot-row .tot .amt { font-size: 26px; font-weight: bold; color: #ff9800; }
.foot-row .field { margin-top: 10px; }

/* ---------- sections (categories) ---------- */
.chips { white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0 0; padding-bottom: 2px; }
.chip { display: inline-block; padding: 8px 16px; border-radius: 18px; border: 1.5px solid #8d8a94; margin: 0 0 0 6px; background: none; color: inherit; font-size: 14px; }
html[dir=ltr] .chip { margin: 0 6px 0 0; }
.chip.on { background: #ff9800; border-color: #ff9800; color: #1c1b1f; font-weight: bold; }
.sec-title { font-size: 16px; font-weight: bold; color: #ff9800; margin: 16px 2px 0; padding-bottom: 6px; border-bottom: 1px solid #3a3a3a; }
body.light .sec-title { border-color: #e2e1e6; }
.sec-title .muted { font-size: 13px; font-weight: normal; }
.grid { margin-top: 10px; }
.cat-row .t { font-size: 17px; font-weight: bold; }
.mgr-sec { font-size: 15px; font-weight: bold; color: #ff9800; margin: 14px 0 0; }

/* ---------- header actions ---------- */
.wide-only { display: none; }
.hbtn2 { border: none; border-radius: 10px; padding: 9px 14px; margin: 0 4px; font-size: 15px; font-weight: bold; background: #2b2930; color: #f2f2f2; white-space: nowrap; }
body.light .hbtn2 { background: #e4e3ea; color: #1c1b1f; }
.hbtn2.primary, body.light .hbtn2.primary { background: #ff9800; color: #1c1b1f; }
.hbtn2 .dot { margin: 0 0 0 6px; }
html[dir=ltr] .hbtn2 .dot { margin: 0 6px 0 0; }

/* ---------- iPad: point-of-sale layout (items + current invoice side by side) ---------- */
@media (min-width: 700px) {
  .narrow-only { display: none !important; }
  .header.onhome .wide-only { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .header.onhome h1 { text-align: right; padding: 0 4px; font-weight: bold; }
  html[dir=ltr] .header.onhome h1 { text-align: left; }
  .header.onhome .hspacer { display: none; }
  #v-home { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; padding: 0; max-width: none; margin: 0; }
  #v-home .pos-main { position: absolute; top: 0; bottom: 0; right: 0; left: 300px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 10px 24px 8px; }
  html[dir=ltr] #v-home .pos-main { right: 300px; left: 0; padding: 8px 8px 24px 10px; }
  #v-home .pos-side { position: absolute; top: 0; bottom: 0; left: 0; width: 300px; }
  html[dir=ltr] #v-home .pos-side { left: auto; right: 0; }
  .pos-main .prod-card { margin: 0; padding: 12px 10px 16px; min-height: 100%; }
  .side-cart { position: absolute; top: 8px; bottom: 168px; left: 10px; right: 0; margin: 0; padding: 0; overflow: hidden; }
  html[dir=ltr] .side-cart { left: 0; right: 10px; }
  .side-head { height: 52px; padding: 0 14px; border-bottom: 1px solid #3a3a3a; }
  body.light .side-head { border-color: #e2e1e6; }
  .side-head h2 { font-size: 16px; }
  .side-cart #cartList { position: absolute; top: 52px; bottom: 0; left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0; padding: 0 12px; }
  .side-foot { position: absolute; bottom: 8px; left: 10px; right: 0; height: 152px; margin: 0; padding: 4px 14px 12px; }
  html[dir=ltr] .side-foot { left: 0; right: 10px; }
  .side-foot .invno { width: 120px; }
  .cart-row .nm { font-size: 14px; }
  .cart-row .sm { font-size: 12px; }
  .qty-btn { width: 30px; height: 30px; line-height: 30px; font-size: 18px; }
  .qty { min-width: 24px; }
  /* smaller, tidier item cards: 3 per row in portrait */
  .grid { margin: 10px -3px 0; }
  .prod { width: 31%; width: -webkit-calc(33.333% - 6px); width: calc(33.333% - 6px); margin: 0 3px 6px; border-radius: 12px; }
  .prod .img, .prod .ph { padding-bottom: 62%; }
  .prod .ph span { font-size: 26px; margin-top: -15px; line-height: 30px; }
  .prod .nm { font-size: 14px; padding: 7px 4px 1px; }
  .prod .pr { font-size: 13px; padding: 0 4px 8px; }
  .prod .badge { top: 5px; left: 5px; min-width: 24px; height: 24px; line-height: 24px; font-size: 13px; border-radius: 12px; }
  html[dir=ltr] .prod .badge { right: 5px; }
  .grid.text .prod .nm { padding-top: 14px; }
  .grid.text .prod .pr { padding-bottom: 14px; }
  .grid.list { margin: 10px -3px 0; }
  .grid.list .prod { float: right; width: 48%; width: -webkit-calc(50% - 6px); width: calc(50% - 6px); margin: 0 3px 6px; }
  html[dir=ltr] .grid.list .prod { float: left; }
  .grid.list .prod .thumb { width: 44px; height: 44px; }
}
/* landscape / wide: 5 items per row */
@media (min-width: 960px) {
  #v-home .pos-main { left: 330px; }
  html[dir=ltr] #v-home .pos-main { right: 330px; left: 0; }
  #v-home .pos-side { width: 330px; }
  .prod { width: 19%; width: -webkit-calc(20% - 6px); width: calc(20% - 6px); }
  .grid.list .prod { width: 32%; width: -webkit-calc(33.333% - 6px); width: calc(33.333% - 6px); }
}
</style>
</head>
<body>

<!-- ======================= header ======================= -->
<div class="header flex between" id="header">
  <button class="hbtn tap" id="menuBtn" onclick="openDrawer()">&#9776;</button>
  <button class="hbtn tap hidden" id="backBtn" onclick="go('home')">&#8594;</button>
  <h1 class="grow" id="headerTitle">فاتورتي</h1>
  <div class="wide-only">
    <button class="hbtn2 tap" onclick="openPrinterModal()"><span class="dot" id="hDot"></span><span id="hPrinter"></span></button>
    <button class="hbtn2 primary tap" onclick="openAddModal()">+ <span data-t="addItemBtn"></span></button>
  </div>
  <div class="hspacer" style="width:44px"></div>
</div>

<!-- ======================= home ======================= -->
<div class="page" id="v-home">
 <div class="pos-main">
  <div class="card pcard flex between narrow-only">

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function readStore(key) {
  try {
    if (window.__nativeStore && window.__nativeStore[key]) return JSON.parse(window.__nativeStore[key]);
    return JSON.parse(localStorage.getItem('fatorati_' + key) || 'null');
  } catch (e) { return null; }
}

function loadState() {
  var s = readStore('state'), media = readStore('media');
  if (s && media) { s.items = media.items || []; if (s.settings) s.settings.logo = media.logo || ''; }
  var st = clone(DEFAULT_STATE);
  if (!s) {   // first launch: a few sample items
    st.items = [

    ];
  }
  if (s && typeof s === 'object') {
    for (var k in s) if (s.hasOwnProperty(k) && k !== 'settings') st[k] = s[k];
    if (s.settings) for (var j in s.settings) if (s.settings.hasOwnProperty(j)) st.settings[j] = s.settings[j];
  }

}

// Items (with their pictures) and the logo are big, so they are stored apart
// and only re-written when they change. Native store = Documents folder.
function storeWrite(key, json) {
  if (window.__isNative) nativeCall('save', { key: key, value: json });
  else { try { localStorage.setItem('fatorati_' + key, json); } catch (e) {} }
}
function save(media) {
  if (media) mediaDirty = true;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    saveTimer = null;
    if (mediaDirty) {
      mediaDirty = false;
      storeWrite('media', JSON.stringify({ items: state.items, logo: state.settings.logo }));
    }
    var light = {};
    for (var k in state) if (state.hasOwnProperty(k) && k !== 'items' && k !== 'settings') light[k] = state[k];
    light.settings = {};
    for (var j in state.settings) if (state.settings.hasOwnProperty(j) && j !== 'logo') light.settings[j] = state.settings[j];
    storeWrite('state', JSON.stringify(light));
  }, 400);
}

window.__nativeQueue = [];
var bridgeFrame = null;
function nativeCall(cmd, extra) {
  var c = extra || {};
  c.cmd = cmd;
  window.__nativeQueue.push(c);
  if (!bridgeFrame) {
    bridgeFrame = document.createElement('iframe');
    bridgeFrame.style.display = 'none';
    document.body.appendChild(bridgeFrame);
  }
  bridgeFrame.src = 'catprint://flush?' + new Date().getTime();
}

  var q = JSON.stringify(window.__nativeQueue);
  window.__nativeQueue = [];

};

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function trim(s) { return String(s || '').replace(/^\s+|\s+$/g, ''); }

function fmtNum(n) {
  n = Math.round((+n || 0) * 100) / 100;
  var neg = n < 0; n = Math.abs(n);
  var parts = String(n).split('.');
  var ip = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + ip + (parts[1] ? '.' + parts[1] : '');
}

// Reads a picked photo, fixes EXIF rotation and the iOS <= 8 large-JPEG
// canvas subsampling bug, then downsizes it to a small JPEG data URL.
function readExifOrientation(buf) {
  try {
    var v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return 1;
    var off = 2, len = v.byteLength;
    while (off < len - 4) {
      var marker = v.getUint16(off);
      off += 2;
      if (marker === 0xFFE1) {
        if (v.getUint32(off + 2) !== 0x45786966) return 1;
        var tiff = off + 8;
        var little = v.getUint16(tiff) === 0x4949;
        var ifd = tiff + v.getUint32(tiff + 4, little);
        var n = v.getUint16(ifd, little);
        for (var i = 0; i < n; i++) {
          var e = ifd + 2 + i * 12;
          if (v.getUint16(e, little) === 0x0112) return v.getUint16(e + 8, little);
        }
        return 1;
      } else if ((marker & 0xFF00) !== 0xFF00) {
        return 1;
      } else {
        off += v.getUint16(off);
      }
    }
  } catch (err) {}
  return 1;
}

function detectSubsampling(img) {
  var w = img.naturalWidth, h = img.naturalHeight;
  if (w * h > 1024 * 1024) {
    var c = document.createElement('canvas'); c.width = c.height = 1;
    var ctx = c.getContext('2d');
    ctx.drawImage(img, -w + 1, 0);
    return ctx.getImageData(0, 0, 1, 1).data[3] === 0;
  }
  return false;
}

function detectVerticalSquash(img, ih) {
  var c = document.createElement('canvas'); c.width = 1; c.height = ih;
  var ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  var data = ctx.getImageData(0, 0, 1, ih).data;
  var sy = 0, ey = ih, py = ih;
  while (py > sy) {
    if (data[(py - 1) * 4 + 3] === 0) ey = py; else sy = py;
    py = (ey + sy) >> 1;
  }
  var ratio = py / ih;
  return ratio === 0 ? 1 : ratio;
}

function processImage(img, orientation, maxSize, cb) {
  var iw = img.naturalWidth, ih = img.naturalHeight;
  if (detectSubsampling(img)) { iw /= 2; ih /= 2; }
  var squash = detectVerticalSquash(img, ih);
  var scale = Math.min(1, maxSize / Math.max(iw, ih));
  var w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
  var swap = orientation >= 5 && orientation <= 8;
  var c = document.createElement('canvas');
  c.width = swap ? h : w; c.height = swap ? w : h;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
  switch (orientation) {
    case 2: ctx.transform(-1, 0, 0, 1, w, 0); break;
    case 3: ctx.transform(-1, 0, 0, -1, w, h); break;
    case 4: ctx.transform(1, 0, 0, -1, 0, h); break;
    case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
    case 6: ctx.transform(0, 1, -1, 0, h, 0); break;
    case 7: ctx.transform(0, -1, -1, 0, h, w); break;
    case 8: ctx.transform(0, -1, 1, 0, 0, w); break;
  }
  ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, w, h / squash);
  cb(c.toDataURL('image/jpeg', 0.8));
}

function pickImage(input, cb, maxSize) {
  var file = input.files && input.files[0];
  if (!file) return;
  var size = maxSize || 300;
  var r1 = new FileReader();
  r1.onload = function () {
    var orientation = readExifOrientation(r1.result);
    var r2 = new FileReader();
    r2.onload = function () {
      var img = new Image();
      img.onload = function () {
        try { processImage(img, orientation, size, cb); } catch (e) { toast(t('imageError')); }
      };
      img.onerror = function () { toast(t('imageError')); };
      img.src = r2.result;
    };
    r2.readAsDataURL(file);
  };
  r1.onerror = function () { toast(t('imageError')); };
  r1.readAsArrayBuffer(file);
  input.value = '';
}

function addToCart(id) {
  var found = false;
  for (var i = 0; i < state.cart.length; i++) {
    if (state.cart[i].id === id) { state.cart[i].qty++; found = true; break; }
  }
  if (!found) state.cart.push({ id: id, qty: 1 });
  save();
  updateBadge(id);
  renderCart();
}

function changeQty(id, d) {
  for (var i = 0; i < state.cart.length; i++) {
    if (state.cart[i].id === id) {
      state.cart[i].qty += d;
      if (state.cart[i].qty <= 0) state.cart.splice(i, 1);
      break;

  updateBadge(id);

function cartLines() {

var devices = {};
var scanning = false, scanResponded = false;
var printer = { state: 'none', name: '', id: '', lastId: '', bluetooth: true };
var printing = false;

function openPrinterModal() {
  $('printerModal').className = 'modal';
  renderPrinter();
  if (printer.state !== 'connected' && !scanning) toggleScan();
}
function closePrinterModal() {
  $('printerModal').className = 'modal hidden';
  if (scanning) nativeCall('stopScan');
}

function toggleScan() {
  if (scanning) { nativeCall('stopScan'); return; }
  devices = {};
  if (printer.id) devices[printer.id] = { id: printer.id, name: printer.name, rssi: -50, likely: true };
  renderDevices();
  scanResponded = false;
  setTimeout(function () { if (!scanResponded) toast(t('bridgeDead'), 4000); }, 2500);
  nativeCall('scan');
}

function connectDevice(id) { nativeCall('connect', { id: id }); }

function signalText(rssi) {
  if (rssi >= -60) return t('sigStrong');
  if (rssi >= -80) return t('sigMid');
  return t('sigWeak');
}

function deviceCount() {
  var n = 0;
  for (var k in devices) if (devices.hasOwnProperty(k)) n++;
  return n;
}

function renderDevices() {
  var list = [];
  for (var k in devices) if (devices.hasOwnProperty(k)) list.push(devices[k]);
  list.sort(function (a, b) {
    if (a.likely !== b.likely) return a.likely ? -1 : 1;
    if (!a.name !== !b.name) return a.name ? -1 : 1;
    return b.rssi - a.rssi;
  });
  var html = '';
  each(list, function (d) {
    var cur = d.id === printer.id;
    var btn;
    if (cur && printer.state === 'connected') btn = '<button class="btn small tap" disabled>' + t('connectedBtn') + '</button>';
    else if (cur && printer.state === 'connecting') btn = '<button class="btn small tap" disabled><span class="spinner"></span></button>';
    else btn = '<button class="btn small tap" onclick="connectDevice(\'' + d.id + '\')">' + t('connectBtn') + '</button>';
    html += '<div class="dev flex between' + (d.likely ? ' likely' : '') + '">' +
      '<div class="grow"><div class="n">' + (d.name ? escapeHtml(d.name) : t('unnamed') + ' (' + d.id.substr(0, 4) + ')') + '</div>' +
      '<div class="s muted">' + (d.likely ? t('likelyPrinter') + ' · ' : '') + signalText(d.rssi) + '</div></div>' + btn + '</div>';
  });
  $('deviceList').innerHTML = html;
  var total = deviceCount(), hint = '';
  if (!list.length && scanning) hint = t('hintSearching');
  else if (!list.length && printer.state !== 'connected') hint = t('hintStart');
  $('deviceHint').textContent = hint;
}

function renderPrinter() {
  var label, dotCls, txtCls;
  if (printer.state === 'connected') { label = t('connectedTo'); dotCls = 'dot on'; txtCls = 'green'; }
  else if (printer.state === 'connecting') { label = t('connectingTo'); dotCls = 'dot wait'; txtCls = 'orange'; }
  else if (!printer.bluetooth) { label = t('btOff'); dotCls = 'dot'; txtCls = 'red'; }
  else { label = t('notConnected'); dotCls = 'dot'; txtCls = 'red'; }
  $('pName').textContent = printer.name || t('printerWord');
  $('pDot').className = dotCls; $('pStateText').textContent = label; $('pStateText').className = txtCls;
  $('mDot').className = dotCls; $('mStateText').textContent = (printer.name ? printer.name + ' · ' : '') + label;
  $('connectBtn').textContent = t('connect');
  $('hDot').className = dotCls;
  $('hPrinter').textContent = printer.state === 'connected' && printer.name ? printer.name : t('searchPrinter');
  $('disconnectBtn').className = 'btn mt ghost tap' + (printer.state === 'none' ? ' hidden' : '');
  $('scanBtn').innerHTML = scanning ? escapeHtml(t('stopScan')) + '<span class="spinner"></span>' : escapeHtml(t('scanPrinters'));
  $('printBtn').disabled = printing;
  renderDevices();
}

// ---- callbacks from native code ----
window.onScanState = function (on) { scanResponded = true; scanning = !!on; renderPrinter(); };
window.onDeviceFound = function (d) {
  var old = devices[d.id];
  if (old && !d.name) d.name = old.name;
  if (old && old.likely) d.likely = true;
  devices[d.id] = d;
  renderDevices();
};
window.onPrinterState = function (st) {
  printer = st;
  if (st.id && !devices[st.id]) devices[st.id] = { id: st.id, name: st.name, rssi: -50, likely: true };
  renderPrinter();
};
// native code names -> page message keys
var EV_ALIAS = { conn_failed: 'connect_fail', conn_timeout: 'connect_timeout', conn_lost: 'connection_lost',
  not_found_again: 'not_found', print_ok: 'printed', conn_lost_printing: 'print_lost', print_busy: 'busy',
  print_bad_data: 'bad_data' };
function evKey(code) { return EV_ALIAS[code] || code; }
window.onNative = function (e) {
  if (e.code === 'diag') { addLog('🔧', e.text); return; }   // technical search log
  e.code = evKey(e.code);
  var msg = t('ev_' + e.code, { name: e.name || '', count: e.count || 0 });
  var icon = EV_ICON[e.code] || 'ℹ️';
  var last = state.log.length ? state.log[state.log.length - 1].m : '';
  if (msg !== last) addLog(icon, msg);
  if (e.code !== 'bt_ready' && e.code !== 'sending') toast(msg);
  if (e.code === 'connected' && $('printerModal').className === 'modal') setTimeout(closePrinterModal, 700);
};
window.onPrintProgress = function (p) { toast(t('printing') + ' ' + p + '%', 3000); };
var afterPrint = null;
window.onPrintDone = function (r) {
  var ok = !!r.ok, code = evKey(r.code);
  printing = false;
  renderPrinter();
  var msg = t('ev_' + code);
  addLog(ok ? '🖨️' : '🛑', msg);
  toast(msg, ok ? 2600 : 4500);
  if (ok && afterPrint) afterPrint();
  afterPrint = null;
  if (!ok && code === 'no_printer') openPrinterModal();
};

// ======================= receipt rendering =======================
var FONT = '"Helvetica Neue", Helvetica, "Geeza Pro", Arial, sans-serif';
function isLtr() { return state.lang === 'en'; }

function loadImage(src, cb) {
  if (!src) { cb(null); return; }
  var img = new Image();
  img.onload = function () { cb(img); };
  img.onerror = function () { cb(null); };
  img.src = src;
}

// blocks: {type:'text', text, size, bold, align} | {type:'row', a, b, size, bold}
//         {type:'line'} | {type:'space', h} | {type:'image', img, w}
function layoutBlocks(ctx, blocks, draw) {
  var W = PRINT_WIDTH, M = 8, y = 6;
  var ltr = isLtr();
  var start = ltr ? M : W - M, end = ltr ? W - M : M;
  var startAlign = ltr ? 'left' : 'right', endAlign = ltr ? 'right' : 'left';
  var imageRects = [];
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';

  function setFont(size, bold) { ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT; }
  function wrap(text, maxW) {
    var words = String(text).split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line || !lines.length) lines.push(line);
    return lines;
  }

  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    if (b.type === 'space') { y += b.h; continue; }
    if (b.type === 'line') {
      y += 8;
      if (draw) ctx.fillRect(M, y, W - 2 * M, 2);
      y += 10;
      continue;
    }
    if (b.type === 'qr') {
      var qr = qrcode(0, 'M');
      qr.addData(b.text);
      qr.make();
      var n = qr.getModuleCount(), cell = Math.max(2, Math.floor(b.size / n)), qs = cell * n;
      var qx = Math.round((W - qs) / 2);
      if (draw) {
        for (var qy = 0; qy < n; qy++) for (var qc = 0; qc < n; qc++) {
          if (qr.isDark(qy, qc)) ctx.fillRect(qx + qc * cell, y + qy * cell, cell, cell);
        }
      }
      y += qs + 10;
      continue;
    }
    if (b.type === 'image') {
      var iw = Math.min(W - 2 * M, b.w), ih = Math.round(b.img.height * iw / b.img.width);
      var ix = Math.round((W - iw) / 2);
      if (draw) { ctx.drawImage(b.img, ix, y, iw, ih); imageRects.push([ix, y, iw, ih]); }
      y += ih + 8;
      continue;
    }
    setFont(b.size, b.bold);
    var lh = Math.round(b.size * 1.35);
    if (b.type === 'text') {
      var lines = wrap(b.text, W - 2 * M);
      for (var j = 0; j < lines.length; j++) {
        if (draw) {
          if (b.align === 'center') { ctx.textAlign = 'center'; ctx.fillText(lines[j], W / 2, y + b.size); }
          else { ctx.textAlign = startAlign; ctx.fillText(lines[j], start, y + b.size); }
        }
        y += lh;
      }
    } else if (b.type === 'row') {
      var bw = ctx.measureText(b.b).width;
      var aLines = wrap(b.a, W - 2 * M - bw - 14);
      if (draw) { ctx.textAlign = endAlign; ctx.fillText(b.b, end, y + b.size); ctx.textAlign = startAlign; }
      for (var k = 0; k < aLines.length; k++) {
        if (draw) ctx.fillText(aLines[k], start, y + b.size);
        y += lh;
      }
    }
  }
  return { height: y + 8, imageRects: imageRects };
}

function renderBlocks(blocks) {
  var canvas = $('printCanvas');
  canvas.width = PRINT_WIDTH; canvas.height = 10;
  var ctx = canvas.getContext('2d');
  var h = Math.ceil(layoutBlocks(ctx, blocks, false).height);
  canvas.height = h;                       // resets the canvas
  ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, PRINT_WIDTH, h);
  var res = layoutBlocks(ctx, blocks, true);
  return { ctx: ctx, width: PRINT_WIDTH, height: h, imageRects: res.imageRects };
}

// ======================= Cat Printer protocol =======================
// Same command sequence as the working Android app (PrinterCommands.kt,
// cmdsPrintImgFast): packet = 51 78 CMD 00 LEN 00 DATA... CRC8(DATA) FF
var CRC8_TABLE = (function () {
  var tb = [];
  for (var i = 0; i < 256; i++) {
    var c = i;
    for (var j = 0; j < 8; j++) c = (c & 0x80) ? ((c << 1) ^ 0x07) & 0xFF : (c << 1) & 0xFF;
    tb.push(c);
  }
  return tb;
})();
function crc8(data) {
  var crc = 0;
  for (var i = 0; i < data.length; i++) crc = CRC8_TABLE[(crc ^ data[i]) & 0xFF];
  return crc;
}
function pushPacket(out, cmd, payload) {
  out.push(0x51, 0x78, cmd, 0x00, payload.length & 0xFF, (payload.length >> 8) & 0xFF);
  for (var i = 0; i < payload.length; i++) out.push(payload[i] & 0xFF);
  out.push(crc8(payload), 0xFF);
}
var CMD_SET_PAPER = 0xA1, CMD_ROW = 0xA2, CMD_STATE = 0xA3, CMD_QUALITY = 0xA4, CMD_LATTICE = 0xA6,
    CMD_ENERGY = 0xAF, CMD_FEED = 0xBD, CMD_APPLY_ENERGY = 0xBE;
var LATTICE_START = [0xAA, 0x55, 0x17, 0x38, 0x44, 0x5F, 0x5F, 0x5F, 0x44, 0x38, 0x2C];
var LATTICE_END   = [0xAA, 0x55, 0x17, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x17];
// print darkness 1..7 -> energy, as densityToEnergy() in the Android app
var DEPTH_ENERGY = [0, 0x2000, 0x4000, 0x6000, 0x8000, 0xA000, 0xD000, 0xFFFF];

// Floyd–Steinberg dithering for pictures (text is simply thresholded)
function ditherRegion(px, W, H, rect) {
  var x0 = Math.max(0, rect[0] | 0), y0 = Math.max(0, rect[1] | 0);
  var w = Math.min(W - x0, Math.ceil(rect[2])), h = Math.min(H - y0, Math.ceil(rect[3]));
  var g = [];
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var i = ((y0 + y) * W + x0 + x) * 4;
    g.push(0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]);
  }
  for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) {
    var k = yy * w + xx, old = g[k], nv = old < 128 ? 0 : 255, err = old - nv;
    if (xx + 1 < w) g[k + 1] += err * 7 / 16;
    if (yy + 1 < h) {
      if (xx > 0) g[k + w - 1] += err * 3 / 16;
      g[k + w] += err * 5 / 16;
      if (xx + 1 < w) g[k + w + 1] += err / 16;
    }
    var p = ((y0 + yy) * W + x0 + xx) * 4;
    px[p] = px[p + 1] = px[p + 2] = nv;
  }
}

function buildPrintJob(r) {
  var px = r.ctx.getImageData(0, 0, r.width, r.height).data;
  each(r.imageRects, function (rect) { ditherRegion(px, r.width, r.height, rect); });
  var depth = Math.max(1, Math.min(7, +state.settings.depth || 7));
  var energy = DEPTH_ENERGY[depth];
  var out = [];
  pushPacket(out, CMD_STATE, [0x00]);
  pushPacket(out, CMD_QUALITY, [0x32]);                              // 200 dpi
  pushPacket(out, CMD_ENERGY, [(energy >> 8) & 0xFF, energy & 0xFF]); // high byte first
  pushPacket(out, CMD_APPLY_ENERGY, [0x01]);
  pushPacket(out, CMD_LATTICE, LATTICE_START);
  for (var y = 0; y < r.height; y++) {
    var line = [];
    for (var b = 0; b < BYTES_PER_LINE; b++) {
      var v = 0;
      for (var bit = 0; bit < 8; bit++) {
        var i = (y * r.width + b * 8 + bit) * 4;
        var lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        if (lum < 128) v |= (1 << bit);     // black = 1, LSB = leftmost dot
      }
      line.push(v);
    }
    pushPacket(out, CMD_ROW, line);
  }
  pushPacket(out, CMD_FEED, [25]);
  pushPacket(out, CMD_SET_PAPER, [0x30, 0x00]);
  pushPacket(out, CMD_SET_PAPER, [0x30, 0x00]);
  pushPacket(out, CMD_SET_PAPER, [0x30, 0x00]);
  pushPacket(out, CMD_LATTICE, LATTICE_END);
  pushPacket(out, CMD_STATE, [0x00]);
  return out;
}

function bytesToBase64(bytes) {
  var parts = [], CH = 0x2000;
  for (var i = 0; i < bytes.length; i += CH) parts.push(String.fromCharCode.apply(null, bytes.slice(i, i + CH)));
  return btoa(parts.join(''));
}

function sendToPrinter(makeBlocks, onSuccess) {
  if (printing) { toast(t('ev_busy')); return; }
  if (printer.state === 'none' && !printer.lastId) { toast(t('ev_no_printer'), 4000); openPrinterModal(); return; }
  printing = true;
  renderPrinter();
  toast(t('preparing'));
  loadImage(state.settings.logo, function (logo) {
    setTimeout(function () {
      try {
        var r = renderBlocks(makeBlocks(logo));
        afterPrint = onSuccess || null;
        nativeCall('print', { data: bytesToBase64(buildPrintJob(r)) });
      } catch (e) {
        printing = false;
        renderPrinter();
        toast(t('ev_bad_data') + ': ' + e.message, 4500);
      }
    }, 30);
  });
}

function printInvoice() {
  if (!cartLines().length) { toast(t('cartIsEmpty')); return; }
  sendToPrinter(invoiceBlocks, function () {
    state.invoiceNo = (+state.invoiceNo || 0) + 1;
    state.cart = [];
    save();
    renderHome();
  });
}

function testPrint() { sendToPrinter(testBlocks); }

// ---- recharge screen ----
function renderRecharge() {
  var html = '';
  each(['zain', 'asia', 'korek'], function (k) {
    html += '<button class="company tap' + (state.company === k ? ' on' : '') + '" onclick="selectCompany(\'' + k + '\')">' + t(k) + '</button>';
  });
  $('companyRow').innerHTML = html;
  var code = trim($('bCode').value), amount = trim($('bAmount').value), hint = '';
  if (!state.company) hint = t('chooseCompany');
  else if (code && code.length < 10) hint = t('codeTooShort');
  $('rechargeHint').textContent = hint;
  $('rechargeBtn').disabled = !(state.company && code.length >= 10 && amount);
}
function selectCompany(k) { state.company = k; save(); renderRecharge(); }

// Pasting a full dial string (e.g. *133*123...#) picks the company itself.
function onRechargeCode() {
  var v = trim($('bCode').value), found = null;
  for (var k in COMPANIES) if (COMPANIES.hasOwnProperty(k) && v.indexOf(COMPANIES[k].prefix) === 0) found = k;
  if (found) {
    v = v.substr(COMPANIES[found].prefix.length);
    if (v.charAt(v.length - 1) === '#') v = v.substr(0, v.length - 1);
    $('bCode').value = v;
    state.company = found;
    save();
  }
  renderRecharge();
}

function printRecharge() {
  var code = trim($('bCode').value), amount = trim($('bAmount').value), company = state.company;
  if (!company || code.length < 10 || !amount) { renderRecharge(); return; }
  sendToPrinter(function () { return rechargeBlocks(company, code, amount); }, function () {
    $('bCode').value = '';
    renderRecharge();
  });
}

// ======================= start =======================
// ======================= fast taps =======================
// UIWebView waits ~300ms after a tap before sending "click" (to see if it is a
// double tap). Here a short tap on anything with an onclick runs at once;
// inputs, selects and labels (file pickers, switches) keep the normal behaviour.
(function () {
  var el = null, x0 = 0, y0 = 0, t0 = 0;
  function target(n) {
    for (; n && n !== document; n = n.parentNode) {
      if (n.nodeType !== 1) continue;
      var tag = n.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'LABEL') return null;
      if (n.getAttribute('onclick') !== null) return n;
    }
    return null;
  }
  function release() { if (el) { el.className = el.className.replace(/ pressed/g, ''); el = null; } }
  document.addEventListener('touchstart', function (e) {
    release();
    if (e.touches.length !== 1) return;
    el = target(e.target);
    if (!el) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = new Date().getTime();
    el.className += ' pressed';
  }, false);
  document.addEventListener('touchmove', function (e) {
    if (!el) return;
    var p = e.touches[0];
    if (Math.abs(p.clientX - x0) > 10 || Math.abs(p.clientY - y0) > 10) release();
  }, false);
  document.addEventListener('touchcancel', release, false);
  document.addEventListener('touchend', function (e) {
    if (!el) return;
    var src = e.target.nodeType === 1 ? e.target : el;
    var isLong = new Date().getTime() - t0 > 700;
    release();
    if (isLong) return;
    e.preventDefault();   // stops the delayed (and duplicate) click
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT') && ae.blur) ae.blur();
    var ev = document.createEvent('MouseEvents');
    ev.initMouseEvent('click', true, true, window, 1, 0, 0, 0, 0, false, false, false, false, 0, null);
    src.dispatchEvent(ev);
  }, false);
})();
