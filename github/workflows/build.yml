name: Build iOS 8 IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ldid zip unzip git

      - name: Setup Theos and iOS 8 SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          git clone https://github.com/xybp888/iOS-SDKs.git ~/sdks-repo
          cp -r ~/sdks-repo/iPhoneOS8.1.sdk ~/theos/sdks/

      - name: Build Application
        env:
          THEOS: /home/runner/theos
        run: |
          make package
          mkdir -p Payload
          cp -r .theos/obj/CatInvoice.app Payload/ || cp -r .theos/obj/debug/CatInvoice.app Payload/
          ldid -S Payload/CatInvoice.app/CatInvoice
          zip -r CatInvoice_iOS8.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CatInvoice-IPA
          path: CatInvoice_iOS8.ipa
